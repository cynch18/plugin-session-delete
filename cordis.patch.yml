# dsh-profile-plugin-session-delete bundle patch (used by `dsh plugin add` installs).
# The install.mjs / install.ps1 paths write the same row into the profile's own
# cordis.patch.yml instead — use ONE installation method, not both
# (installing twice would create duplicate plugin-session-delete rows).
#
# session-delete is a pure additive capability: one insert row, no disables.
# No client bundle is patched: the client half registers into stock slots
# (sidebar.workspaces.session.menu.item, shell.overlay, settings.section) through
# ctx.slots.inject, so a DSH upgrade cannot strand a half-written bundle.
- insert:
    - id: plugin-session-delete
      name: dsh-profile-plugin-session-delete
